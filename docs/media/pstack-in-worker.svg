<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1010" width="1500" height="1010" role="img" aria-labelledby="t d">
<title id="t">pstack inside every worker</title>
<desc id="d">One Atomic run is one attempt of one ticket: prepare (worktree and brief), work (the Sol stage), inspect, verify (a fresh Opus session), publish (bot push and one pull request). pstack is loaded into the work stage: poteto-mode, the mandate; the matched playbook, copied into a todolist; the principles, named per decision. Verification by a different model family is attached to the verify step: Sol writes, Opus checks, and the verdict is bound to the commit. A FAIL returns its reasons as a new attempt.</desc>
